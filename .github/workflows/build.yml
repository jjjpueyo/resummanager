name: Build IPA
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: CadCamStock-repo
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (sense signar)
        shell: bash
        run: |
          xcodebuild -project CadCamStock.xcodeproj -scheme CadCamStock \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CadCamStock.app Payload/
          zip -r CadCamStock.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CadCamStock-ipa
          path: CadCamStock-repo/CadCamStock.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: CadCamStock-repo/build.log
